services:
  api:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ledger-data:/workspace/data
  worker:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    environment:
      DOCINTEL_LLM_URL: ${DOCINTEL_LLM_URL:-}
      DOCINTEL_LLM_MODEL: ${DOCINTEL_LLM_MODEL:-}
      DOCINTEL_LLM_KEY: ${DOCINTEL_LLM_KEY:-}
    volumes:
      - ledger-data:/workspace/data

volumes:
  ledger-data:
